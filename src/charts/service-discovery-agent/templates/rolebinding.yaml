apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "service-discovery-agent.fullname" . }}-mgmt
  namespace: {{ include "service-discovery-agent.agentNamespace" . }}
  labels:
    {{- include "service-discovery-agent.labels" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "service-discovery-agent.fullname" . }}-mgmt
subjects:
  - kind: ServiceAccount
    name: {{ include "service-discovery-agent.serviceAccountName" . }}
    namespace: {{ include "service-discovery-agent.agentNamespace" . }}
