{{- if eq .Values.discovery.scope "cluster" -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "service-discovery-agent.fullname" . }}-view
  labels:
    {{- include "service-discovery-agent.labels" . | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations:
    {{- toYaml .Values.commonAnnotations | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "service-discovery-agent.fullname" . }}-view
subjects:
  - kind: ServiceAccount
    name: {{ include "service-discovery-agent.serviceAccountName" . }}
    namespace: {{ include "service-discovery-agent.agentNamespace" . }}
{{- end }}
